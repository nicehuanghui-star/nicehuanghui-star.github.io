  "biography": {
    "zh": "黄晖，工学博士，海南大学计算机科学与技术学院副教授。2019 年 9 月至 2024 年 6 月在加拿大戴尔豪斯大学攻读计算机科学专业博士学位，2024 年 11 月加入海南大学。\n研究主要围绕深度强化学习、边缘计算、边缘智能与智慧医疗展开，关注动态网络环境下实时任务卸载、计算资源分配和安全约束决策。具体研究涵盖截止期感知与部分可观测条件下的卸载策略、基于约束强化学习的安全关键任务调度，以及分布式编码机器学习中的工作负载分配、工作节点选择和多智能体协同；同时关注绿色计算与强化学习驱动的功耗管理。\n相关研究成果发表于 IEEE Transactions on Network Science and Engineering、IEEE Transactions on Cognitive Communications and Networking、IEEE Transactions on Industrial Informatics、IEEE Internet of Things Journal、ACM Transactions on Sensor Networks 等期刊及 IEEE ICC、GLOBECOM、VTC 等国际会议。\n主持海南省自然科学基金面上项目“数字化背景下基于深度强化学习移动边缘计算驱动的智慧康养”。担任 IEEE ICC、GLOBECOM、FCN、PST 等会议技术程序委员会委员，以及多本 IEEE 期刊审稿人；获评 2024 年 IEEE Transactions on Mobile Computing 和 IEEE Transactions on Network Science and Engineering 优秀审稿人。",
    "en": "I am an Associate Professor in the School of Computer Science and Technology at Hainan University, which I joined in November 2024. I received my Ph.D. in Computer Science from Dalhousie University, Canada, in June 2024, following doctoral studies from September 2019 to June 2024.\nMy research focuses on deep reinforcement learning, edge computing, and edge intelligence, with applications to intelligent healthcare and energy-efficient computing. I investigate how learning-based decision-making can support real-time task offloading and resource allocation in dynamic, resource-constrained networks. My work addresses deadline-aware offloading under partial observability, constrained reinforcement learning for safety-critical tasks, and multi-agent approaches to workload allocation and worker selection in distributed coded machine learning. I also study reinforcement-learning-based power management.\nMy research has been published in IEEE Transactions on Network Science and Engineering, IEEE Transactions on Cognitive Communications and Networking, IEEE Transactions on Industrial Informatics, IEEE Internet of Things Journal, and ACM Transactions on Sensor Networks, as well as at IEEE ICC, GLOBECOM, and VTC. I have served as Principal Investigator on a General Project funded by the Hainan Provincial Natural Science Foundation, focusing on deep reinforcement learning and mobile edge computing for intelligent healthcare. My professional service includes technical program committee membership for ICC, GLOBECOM, FCN, and PST, and reviewing for IEEE journals. In 2024, I received Outstanding Reviewer recognition from IEEE Transactions on Mobile Computing and IEEE Transactions on Network Science and Engineering."
  },
