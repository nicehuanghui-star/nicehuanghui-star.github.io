<div class="student-table-wrap">
<table class="student-table">
  <caption>指导的四位 2022 级本科生</caption>
  <thead><tr><th scope="col">学生</th><th scope="col">升学去向</th><th scope="col">毕业设计荣誉</th></tr></thead>
  <tbody>
  {% for student in site.data.huihuang.supervision %}
    <tr><th scope="row">{{ student.name.zh | escape }}</th><td>{{ student.destination.zh | escape }}</td><td>{% if student.award %}{{ student.award.zh | escape }}{% else %}—{% endif %}</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
